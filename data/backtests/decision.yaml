chosen: bt
decision: 'Keep BT (Bradley-Terry with a VRS prior, optimised for P(5 or more correct)) as the default. Over 13 Swiss stages
  from five Majors it has the highest mean correct picks (4.31 of 10) and it was highest or tied for highest on all three simulation seeds tried
  at 100k sims (4.31, 4.38, 4.31). The edge is small: +0.15 picks per stage over VRS seeds alone, with a paired 95% CI of
  -0.54 to +0.92, so the data cannot tell BT from VRS-only, the BT+VRS ensembles or the seed-anchored tie-break. No alternative
  beats BT either, and BT has the best Brier score (0.227 vs 0.244 for VRS), so there is no reason to switch. Maximising expected
  correct picks instead of P(5 or more) never helped and usually cost a coin or two.'
