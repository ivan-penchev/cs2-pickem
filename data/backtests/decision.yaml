chosen: bt
decision: 'Keep BT (Bradley-Terry with a VRS prior, optimised for P(5 or more correct)) as the default for now. This run uses
  the full live-equivalent model: HLTV results and per-map stats from before each stage feed the ratings and the veto model.
  Over 13 Swiss stages BT averages 4.46 correct picks of 10 and earns 8 coins. The BT+VRS 50/50 logit ensemble now has the
  highest mean, 4.62 with 9 coins, but its paired edge over BT is +0.15 picks per stage with a 95% CI of -0.15 to +0.54, and
  most of it comes from a single stage (Budapest Stage 3). At 100k sims averaged over three seeds the two are level (BT 4.36,
  ensemble 4.38), so the data cannot separate them. BT also has the better Brier score (0.227 vs 0.233). Switching the default
  is left to the maintainer. Maximising expected correct picks instead of P(5 or more) still never helped.'
