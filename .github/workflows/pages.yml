name: Pages

# Publishes the committed site/ folder (cs2pickem site build output) to GitHub Pages.
# live.yml deploys on its own after bot commits (GITHUB_TOKEN pushes don't trigger workflows).
# Enable it under Settings → Pages → Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
          include-hidden-files: true

  # Separate job so the artifact is registered before deploy-pages looks it up.
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}
    steps:
      - id: deploy1
        name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - name: Wait before retry
        if: steps.deploy1.outcome == 'failure'
        run: echo "::warning::Pages deploy failed, retrying in 30s"; sleep 30
      - id: deploy2
        name: Deploy to GitHub Pages (retry)
        if: steps.deploy1.outcome == 'failure'
        uses: actions/deploy-pages@v5
      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.deploy1.outcome }}" = success ]; then r="deployed on first attempt"
          elif [ "${{ steps.deploy2.outcome }}" = success ]; then r="deployed on retry (first attempt failed)"
          else r="FAILED after retry"; fi
          echo "### Pages deploy" >> "$GITHUB_STEP_SUMMARY"
          echo "$r: ${{ steps.deploy1.outputs.page_url || steps.deploy2.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
          [ "$r" != "FAILED after retry" ] || { echo "::error::Pages deploy $r"; exit 1; }
