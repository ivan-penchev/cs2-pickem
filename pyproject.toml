[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cs2pickem"
version = "0.1.0"
description = "Predictive analytics and Pick'Em optimizer for CS2 Majors (Swiss stages + playoffs)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.1",
  "typer>=0.12",
  "rich>=13.7",
  "pyyaml>=6.0",
  "pydantic>=2.6",
  "httpx>=0.27",
]

[project.optional-dependencies]
scrape = ["playwright>=1.44"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
cs2pickem = "cs2pickem.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B008"]
